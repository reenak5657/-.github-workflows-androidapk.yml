      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
name: Build REENA 3D Game Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find Android Project
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path '*/.git/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found. Upload the Android project files first."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REENA-3D-GAME-HUB-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
